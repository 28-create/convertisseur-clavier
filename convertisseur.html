<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="light" data-fontsize="medium">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convertisseur Clavier Latin ⇄ Hébreu (AZERTY / QWERTY)</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1a1a1a; --muted: #666;
    --border: #ddd; --accent: #2563eb; --accent-hover: #1d4ed8;
    --out-bg: #f6f6f6; --shadow: 0 8px 30px rgba(0,0,0,.18);
  }
  html[data-theme="dark"] {
    --bg: #14161a; --card: #1e2126; --text: #e8e8e8; --muted: #a0a0a0;
    --border: #3a3f46; --accent: #4f8cff; --accent-hover: #3b78ec;
    --out-bg: #26292f; --shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text);
    margin: 0; padding: 0; line-height: 1.5; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  header.top h1 { font-size: 1.4rem; margin: 0; }
  .subtitle { color: var(--muted); margin: .4rem 0 1rem; }
  .subtitle code { background: var(--out-bg); border: 1px solid var(--border);
    border-radius: 4px; padding: 0 .3rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 1rem; margin-bottom: 1rem; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; margin: .8rem 0; align-items: center; }
  label.lbl { font-weight: 600; display: block; margin-bottom: .3rem; }
  textarea { width: 100%; min-height: 120px; padding: .6rem; resize: vertical;
    font-size: 1.1rem; color: var(--text); background: var(--card);
    border: 1px solid var(--border); border-radius: 8px; }
  html[data-fontsize="small"] textarea, html[data-fontsize="small"] .out { font-size: .95rem; }
  html[data-fontsize="large"] textarea, html[data-fontsize="large"] .out { font-size: 1.35rem; }
  button, select { padding: .5rem 1rem; cursor: pointer; font-size: 1rem;
    border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-hover); }
  button.ghost { background: transparent; }
  .out { background: var(--out-bg); padding: .8rem; white-space: pre-wrap;
    word-break: break-word; min-height: 80px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 1.15rem; }
  .out[dir="rtl"] { text-align: right; }
  #detect { color: var(--muted); min-height: 1.4em; }
  #stats { color: var(--muted); }
  /* Settings panel */
  #settingsOverlay { position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: none; z-index: 40; }
  #settingsOverlay.open { display: block; }
  #settingsPanel { position: fixed; top: 0; bottom: 0; inset-inline-end: 0; width: min(380px, 92vw);
    background: var(--card); color: var(--text); border-inline-start: 1px solid var(--border);
    box-shadow: var(--shadow); z-index: 41; transform: translateX(105%);
    transition: transform .22s ease; display: flex; flex-direction: column; }
  html[dir="rtl"] #settingsPanel { transform: translateX(-105%); }
  #settingsPanel.open,
  html[dir="rtl"] #settingsPanel.open { transform: translateX(0); }
  .panel-head { display: flex; align-items: center; justify-content: space-between;
    padding: 1rem; border-bottom: 1px solid var(--border); }
  .panel-head h2 { margin: 0; font-size: 1.15rem; }
  .panel-body { padding: 1rem; overflow-y: auto; }
  .panel-body fieldset { border: 0; padding: 0; margin: 0 0 1.2rem; min-width: 0; }
  .panel-body legend { margin-bottom: .5rem; font-size: .95rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: .04em; padding: 0; }
  .radio-col { display: flex; flex-direction: column; gap: .35rem; }
  .panel-foot { padding: 1rem; border-top: 1px solid var(--border);
    display: flex; gap: .5rem; justify-content: flex-end; }
  .check { display: flex; align-items: center; gap: .5rem; margin: .35rem 0; }
</style>
</head>
<body>
<noscript><div class="wrap"><p class="card">JavaScript est requis / JavaScript is required / נדרש JavaScript.</p></div></noscript>
<div class="wrap">
  <header class="top">
    <h1 data-i18n="title">Convertisseur clavier Latin ⇄ Hébreu</h1>
    <button id="openSettings" class="ghost" aria-haspopup="dialog" aria-controls="settingsPanel" aria-expanded="false" data-i18n-aria="settings" aria-label="Réglages">⚙ <span data-i18n="settings">Réglages</span></button>
  </header>
  <p class="subtitle"><span data-i18n="subtitle">Collez un texte tapé avec le mauvais clavier, il est converti automatiquement.</span><br>
    <small dir="ltr">AZERTY : <code>qkuo</code> ↔ <code>שלום</code> &nbsp;|&nbsp; QWERTY : <code>akuo</code> ↔ <code>שלום</code></small>
  </p>

  <div class="card">
    <label class="lbl" for="input" data-i18n="inputLabel">Texte à convertir :</label>
    <textarea id="input" dir="auto" data-i18n-ph="placeholder" placeholder="Collez ici... ex: qkuo  ou  נםמחםור"></textarea>
    <div class="row">
      <button id="auto" class="primary" data-i18n="auto">🔄 Auto (recommandé)</button>
      <button id="toHe" data-i18n="toHe">Latin → Hébreu</button>
      <button id="toFr" data-i18n="toFr">Hébreu → Latin</button>
      <button id="swap" data-i18n="swap" data-i18n-title="swapTitle" title="Échanger entrée/sortie">⇄ Inverser</button>
      <button id="clear" data-i18n="clear" data-i18n-title="clearTitle" title="Tout effacer">✕ Effacer</button>
      <button id="copy" data-i18n="copy">📋 Copier (Ctrl+Entrée)</button>
    </div>
    <div class="row">
      <span id="stats"><small></small></span>
    </div>
    <p id="detect" dir="auto" aria-live="polite"></p>
    <label class="lbl" data-i18n="resultLabel">Résultat :</label>
    <div id="output" class="out" dir="auto"></div>
  </div>

  <div class="card">
    <h3 style="margin-top:0" data-i18n="examples">Exemples pour tester</h3>
    <div class="row" dir="ltr">
      <button data-ex="qkuo" data-layout="azerty">AZERTY : qkuo → שלום ?</button>
      <button data-ex="akuo" data-layout="qwerty">QWERTY : akuo → שלום ?</button>
      <button data-ex="נםמחםור">נםמחםור → bonjour ?</button>
      <button data-ex="Bםמחםור" data-layout="azerty">Bםמחםור → Bonjour ?</button>
    </div>
  </div>
</div>

<div id="settingsOverlay"></div>
<aside id="settingsPanel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="panel-head">
    <h2 id="settingsTitle" data-i18n="settingsTitle">Réglages</h2>
    <button id="closeSettings" class="ghost" data-i18n="close">Fermer</button>
  </div>
  <div class="panel-body">
    <fieldset>
      <legend data-i18n="secLang">Langue d'interface</legend>
      <div class="radio-col" id="langGroup">
        <label><input type="radio" name="lang" value="auto"> <span data-i18n="langAuto">Automatique (navigateur)</span></label>
        <label><input type="radio" name="lang" value="fr"> Français</label>
        <label><input type="radio" name="lang" value="en"> English</label>
        <label><input type="radio" name="lang" value="he"> עברית</label>
      </div>
    </fieldset>
    <fieldset>
      <legend data-i18n="secKeyboard">Clavier physique</legend>
      <div class="radio-col" id="layoutGroup">
        <label><input type="radio" name="layout" value="azerty"> <span data-i18n="layoutAzerty">AZERTY (français)</span></label>
        <label><input type="radio" name="layout" value="qwerty"> <span data-i18n="layoutQwerty">QWERTY (anglais)</span></label>
      </div>
    </fieldset>
    <fieldset>
      <legend data-i18n="secDirection">Sens de conversion par défaut</legend>
      <div class="radio-col" id="dirGroup">
        <label><input type="radio" name="direction" value="auto"> <span data-i18n="dirAuto">Auto-détection</span></label>
        <label><input type="radio" name="direction" value="toHe"> <span data-i18n="dirToHe">Toujours Latin → Hébreu</span></label>
        <label><input type="radio" name="direction" value="toFr"> <span data-i18n="dirToFr">Toujours Hébreu → Latin</span></label>
      </div>
    </fieldset>
    <fieldset>
      <legend data-i18n="secTheme">Thème</legend>
      <div class="radio-col" id="themeGroup">
        <label><input type="radio" name="theme" value="light"> <span data-i18n="themeLight">Clair</span></label>
        <label><input type="radio" name="theme" value="dark"> <span data-i18n="themeDark">Sombre</span></label>
        <label><input type="radio" name="theme" value="auto"> <span data-i18n="themeAuto">Automatique (système)</span></label>
      </div>
    </fieldset>
    <fieldset>
      <legend data-i18n="secFont">Taille du texte</legend>
      <div class="radio-col" id="fontGroup">
        <label><input type="radio" name="fontsize" value="small"> <span data-i18n="fontSmall">Petit</span></label>
        <label><input type="radio" name="fontsize" value="medium"> <span data-i18n="fontMedium">Moyen</span></label>
        <label><input type="radio" name="fontsize" value="large"> <span data-i18n="fontLarge">Grand</span></label>
      </div>
    </fieldset>
    <fieldset>
      <legend data-i18n="secBehavior">Comportement</legend>
      <label class="check"><input type="checkbox" id="optLive"> <span data-i18n="liveConvert">Conversion en direct pendant la frappe</span></label>
      <label class="check"><input type="checkbox" id="optAutocopy"> <span data-i18n="autocopy">Copie auto du résultat</span></label>
      <label class="check"><input type="checkbox" id="optRemember"> <span data-i18n="remember">Mémoriser le texte saisi</span></label>
    </fieldset>
  </div>
  <div class="panel-foot">
    <button id="resetSettings" data-i18n="reset">Réinitialiser</button>
    <button id="doneSettings" class="primary" data-i18n="close">Fermer</button>
  </div>
</aside>

<script>

  'ו': 'u', 'ן': 'i', 'ם': 'o', 'פ': 'p', ']': '[', '[': ']',

    autocopy: 'העתקה אוטומטית של התוצאה', remember: 'זכירת הטקסט שהוקלד',

    detectedFr: 'זוהה: טקסט לטיני ← הומר לעברית (מצב {layout}).',

    copied: 'הועתק!', chars: '{n} תווים' },
};
const DEFAULTS = { lang: 'auto', layout: 'azerty', direction: 'auto', theme: 'light',
  fontsize: 'medium', live: true, autocopy: false, remember: true };
let settings = Object.assign({}, DEFAULTS);
try {
  const raw = localStorage.getItem('conv-settings-v1');
  if (raw) settings = Object.assign({}, DEFAULTS, JSON.parse(raw));
  // migration : 'fr' était l'ancien défaut forcé -> bascule vers l'auto,
  // sauf choix explicite 'en' / 'he' qu'on respecte.
  if (settings.lang === 'fr') settings.lang = 'auto';
  if (!['auto', 'fr', 'en', 'he'].includes(settings.lang)) settings.lang = 'auto';
  // migration des anciennes clés
  if (!raw) {
    const l = localStorage.getItem('conv-layout');
    if (l === 'qwerty' || l === 'azerty') settings.layout = l;
    if (localStorage.getItem('conv-autocopy') === '1') settings.autocopy = true;
  }
} catch {}
let savedText = '';
try { savedText = localStorage.getItem('conv-input') || ''; } catch {}

function effLang() {
  if (settings.lang && settings.lang !== 'auto') return settings.lang;
  const nav = ((navigator.language || 'fr') + '').toLowerCase();
  if (nav.startsWith('he')) return 'he';
  if (nav.startsWith('en')) return 'en';
  return 'fr';
}
function t(key) { const L = effLang(); return (I18N[L] && I18N[L][key]) || I18N.fr[key] || key; }
function saveSettings() {
  try {
    localStorage.setItem('conv-settings-v1', JSON.stringify(settings));
    if (settings.remember) localStorage.setItem('conv-input', input.value);
    else localStorage.removeItem('conv-input');
  } catch {}
}
function applyTheme() {
  let th = settings.theme;
  if (th === 'auto') th = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', th);
}
function applySettingsToUI() {
  const L = effLang();
  document.documentElement.setAttribute('lang', L);
  document.documentElement.setAttribute('dir', L === 'he' ? 'rtl' : 'ltr');
  document.title = t('docTitle');
  document.documentElement.setAttribute('data-fontsize', settings.fontsize);
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph'))); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria'))); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.setAttribute('title', t(el.getAttribute('data-i18n-title'))); });
  document.querySelectorAll('input[name="lang"]').forEach(r => { r.checked = r.value === settings.lang; });
  document.querySelectorAll('input[name="layout"]').forEach(r => { r.checked = r.value === settings.layout; });
  document.querySelectorAll('input[name="direction"]').forEach(r => { r.checked = r.value === settings.direction; });
  document.querySelectorAll('input[name="theme"]').forEach(r => { r.checked = r.value === settings.theme; });
  document.querySelectorAll('input[name="fontsize"]').forEach(r => { r.checked = r.value === settings.fontsize; });
  document.getElementById('optLive').checked = !!settings.live;
  document.getElementById('optAutocopy').checked = !!settings.autocopy;
  document.getElementById('optRemember').checked = !!settings.remember;
  applyTheme();
}

// --- conversion ---
function convertWith(text, layout, dir) {
  const m = dir === 'toFr' ? MAPS[layout].toFr : MAPS[layout].toHe;
  return [...text].map(ch => (ch in m ? m[ch] : ch)).join('');
}
function detectDir(text) {
  const h = (text.match(/[\u0590-\u05FF]/g) || []).length;
  const l = (text.match(/[A-Za-zéèêëàâäçîïôöùûüÉÈÀÇÙ]/g) || []).length;
  return (h > 0 && h >= l * 0.2) ? 'toFr' : 'toHe';
}
const input = document.getElementById('input');
const output = document.getElementById('output');
const detect = document.getElementById('detect');

function dirMessage(dir) {
  const lbl = MAPS[settings.layout].label;
  if (settings.direction !== 'auto') return (dir === 'toFr' ? t('forcedFr') : t('forcedHe')).replace('{layout}', lbl);
  return (dir === 'toFr' ? t('detectedHe') : t('detectedFr')).replace('{layout}', lbl);
}
function doConvert(forced) {
  const dir = forced || (settings.direction !== 'auto' ? settings.direction : detectDir(input.value));
  const out = convertWith(input.value, settings.layout, dir);
  output.textContent = out;
  output.setAttribute('dir', /[\u0590-\u05FF]/.test(out) ? 'rtl' : 'ltr');
  detect.textContent = input.value ? dirMessage(dir) : '';
  const n = input.value.length;
  document.querySelector('#stats small').textContent = n ? t('chars').replace('{n}', n) : '';
  if (settings.autocopy && out) navigator.clipboard.writeText(out).catch(() => {});
  saveSettings();
}
async function copyResult() {
  if (!output.textContent) return;
  await navigator.clipboard.writeText(output.textContent);
  detect.textContent = t('copied');
}
document.getElementById('auto').onclick = () => doConvert();
document.getElementById('toHe').onclick = () => doConvert('toHe');
document.getElementById('toFr').onclick = () => doConvert('toFr');
document.getElementById('swap').onclick = () => {
  input.value = output.textContent;
  doConvert();
};
document.getElementById('clear').onclick = () => { input.value = ''; doConvert(); input.focus(); };
document.getElementById('copy').onclick = copyResult;
input.addEventListener('input', () => { if (settings.live) doConvert(); else saveSettings(); });
input.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); copyResult(); }
});
document.querySelectorAll('[data-ex]').forEach(b => {
  b.onclick = () => {
    if (b.getAttribute('data-layout')) { settings.layout = b.getAttribute('data-layout'); applySettingsToUI(); }
    input.value = b.getAttribute('data-ex'); doConvert();
  };
});

// --- panneau réglages ---
const panel = document.getElementById('settingsPanel');
const overlay = document.getElementById('settingsOverlay');
const openBtn = document.getElementById('openSettings');
let lastFocus = null;
function openPanel() {
  lastFocus = document.activeElement;
  panel.classList.add('open'); overlay.classList.add('open');
  openBtn.setAttribute('aria-expanded', 'true');
  document.getElementById('closeSettings').focus();
}
function closePanel() {
  if (!panel.classList.contains('open')) return;
  panel.classList.remove('open'); overlay.classList.remove('open');
  openBtn.setAttribute('aria-expanded', 'false');
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
// focus trap : Tab reste dans le panneau tant qu'il est ouvert
panel.addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  const f = [...panel.querySelectorAll('button, input, select, textarea, [tabindex]')]
    .filter(el => !el.disabled && el.getClientRects().length);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
document.getElementById('openSettings').onclick = openPanel;
document.getElementById('closeSettings').onclick = closePanel;
document.getElementById('doneSettings').onclick = closePanel;
overlay.onclick = closePanel;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
function bindRadio(name, key, after) {
  document.querySelectorAll('input[name="' + name + '"]').forEach(r => {
    r.onchange = () => { settings[key] = r.value; applySettingsToUI(); saveSettings(); if (after) after(); };
  });
}
bindRadio('lang', 'lang', () => doConvert());
bindRadio('layout', 'layout', () => doConvert());
bindRadio('direction', 'direction', () => doConvert());
bindRadio('theme', 'theme');
bindRadio('fontsize', 'fontsize');
document.getElementById('optLive').onchange = e => { settings.live = e.target.checked; saveSettings(); if (settings.live) doConvert(); };
document.getElementById('optAutocopy').onchange = e => { settings.autocopy = e.target.checked; saveSettings(); };
document.getElementById('optRemember').onchange = e => { settings.remember = e.target.checked; saveSettings(); };
document.getElementById('resetSettings').onclick = () => {
  settings = Object.assign({}, DEFAULTS);
  applySettingsToUI(); saveSettings(); doConvert();
};
if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', () => { if (settings.theme === 'auto') applyTheme(); });
}

// init
if (settings.remember && savedText) input.value = savedText;
applySettingsToUI();
doConvert();
</script>
</body>
</html>
