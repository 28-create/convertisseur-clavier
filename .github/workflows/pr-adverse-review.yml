name: "Review Adverse des PR"

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: AI PR Review
        uses: jonit-dev/openrouter-github-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          open_router_key: ${{ secrets.OPEN_ROUTER_KEY }} # Utilise le secret créé à l'instant
          model_id: 'google/gemini-2.5-flash:free' # Modèle gratuit et puissant
          max_tokens: '4096'
          custom_prompt: |
            Agis comme un auditeur de sécurité senior et un relecteur de code impitoyable.
            Effectue une review ADVERSE. Ne sois pas poli, sois constructif mais ultra-critique.
            Analyse ce code à la recherche de :
            1. Failles de sécurité majeures et injections.
            2. Cas limites (edge cases) non gérés provoquant des crashs.
            3. Problèmes d'optimisation et fuites de mémoire.
            4. Mauvaises pratiques évidentes selon le langage.
